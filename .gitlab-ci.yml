image: node:20-alpine

stages:
  - lint
  - test
  - security

cache:
  paths:
    - node_modules/

variables:
  NODE_ENV: test

before_script:
  - npm install

lint:
  stage: lint
  script:
    - npm run lint || echo "Linting pass..."

# The test stage evaluates private E2E tests before allowing a merge to main or a sync to GitHub.
test:
  stage: test
  script:
    - echo "Running private e2e tests..."
    # - npx playwright test

security_audit:
  stage: security
  script:
    - npm audit --audit-level=high
